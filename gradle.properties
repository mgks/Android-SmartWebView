## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:MaxMetaspaceSize=1G -Dkotlin.daemon.jvm.options\="-Xmx2048M" -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Disable configuration cache if it causes issues with newer plugins
org.gradle.configuration-cache=false

# Aggressive HTTP timeouts (5 minutes) to prevent network hangups
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableResourceOptimizations=true

# Warnings
android.debug.obsoleteApi=true
org.gradle.warning.mode=all
android.defaults.buildfeatures.resvalues=true